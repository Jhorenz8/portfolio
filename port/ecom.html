<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogratz Store — Nike Shoes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e8b4b4;
            background-color: #1a1a1a;
            background-image: linear-gradient(rgba(26,26,26,0.92), rgba(26,26,26,0.92)), url('images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        a { text-decoration: none; color: #e8b4b4; }

        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 1000;
            background-color: rgba(34,34,34,0.97);
            border-bottom: 1px solid #333;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 40px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { height: 36px; width: auto; }
        .brand .title { font-size: 1.3rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 24px; }
        .back-link { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        .back-link:hover { color: #e8b4b4; }
        .cart-btn {
            position: relative; background: none; border: 1px solid #e8b4b4; color: #e8b4b4;
            font-size: 1.1rem; padding: 8px 16px; cursor: pointer; border-radius: 6px;
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .cart-btn:hover { background-color: #e8b4b4; color: #1a1a1a; }
        .cart-count {
            background: #e8b4b4; color: #1a1a1a; font-size: 0.75rem; font-weight: 700;
            border-radius: 50%; min-width: 20px; height: 20px; line-height: 20px;
            text-align: center; padding: 0 5px; display: inline-block;
        }
        .cart-btn:hover .cart-count { background: #1a1a1a; color: #e8b4b4; }

        /* LAYOUT */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px 80px; }
        .page-title { font-size: 2.2rem; color: #fff; margin-bottom: 6px; }
        .page-sub { color: #e8b4b4; margin-bottom: 32px; }
        .notice {
            background: rgba(232,180,180,0.08); border: 1px solid rgba(232,180,180,0.35);
            color: #e8b4b4; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.9rem;
        }

        /* PRODUCT GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
        .card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(232,180,180,0.25);
            border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-6px); border-color: #e8b4b4; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 190px; background: #111; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
        .card:hover .card-img img { transform: scale(1.07); }
        .card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .card-body h3 { color: #fff; font-size: 1.05rem; line-height: 1.3; }
        .card-body .desc { font-size: 0.82rem; color: #c99696; }
        .card-body .price { font-size: 1.25rem; font-weight: 700; color: #e8b4b4; }
        .row { display: flex; gap: 10px; align-items: center; }
        .size-select {
            flex: 1; background: #2a2a2a; color: #e8b4b4; border: 1px solid #444;
            padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        .add-btn {
            background: #e8b4b4; color: #1a1a1a; border: none; padding: 10px 14px; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.9rem; white-space: nowrap;
        }
        .add-btn:hover { background: #fff; }

        /* SKELETON LOADER */
        .sk-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(232,180,180,0.15); border-radius: 14px; overflow: hidden; }
        .sk-card .sk-img { height: 190px; background: #242424; }
        .sk-card .sk-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .sk-line { height: 13px; border-radius: 6px; background: #242424; }
        .sk-line.w80 { width: 80%; }
        .sk-line.w60 { width: 60%; }
        .sk-line.w40 { width: 40%; }
        .sk-img, .sk-line { position: relative; overflow: hidden; }
        .sk-img::after, .sk-line::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent);
            animation: shimmer 1.4s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* CART PANEL */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .cart-overlay.open { opacity: 1; visibility: visible; }
        .cart-panel {
            position: fixed; top: 0; right: 0; height: 100%; width: 380px; max-width: 90vw;
            background: #1f1f1f; border-left: 1px solid #333; z-index: 2001;
            transform: translateX(100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column;
        }
        .cart-panel.open { transform: translateX(0); }
        .cart-head { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #333; }
        .cart-head h2 { color: #fff; font-size: 1.2rem; }
        .close-cart { background: none; border: none; color: #e8b4b4; font-size: 1.6rem; cursor: pointer; }
        .close-cart:hover { color: #ff6b6b; }
        .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
        .cart-empty { text-align: center; color: #c99696; margin-top: 40px; }
        .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .cart-item .info { flex: 1; }
        .cart-item .info .name { color: #fff; font-size: 0.9rem; }
        .cart-item .info .meta { color: #c99696; font-size: 0.8rem; margin-top: 2px; }
        .cart-item .info .price { color: #e8b4b4; font-size: 0.9rem; margin-top: 4px; }
        .qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .qty button { background: #2a2a2a; color: #e8b4b4; border: 1px solid #444; width: 26px; height: 26px; cursor: pointer; border-radius: 4px; }
        .remove-btn { background: none; border: none; color: #c99696; cursor: pointer; font-size: 1.1rem; padding: 4px; margin-left: auto; line-height: 1; }
        .remove-btn:hover { color: #ff6b6b; }
        .cart-foot { padding: 20px; border-top: 1px solid #333; }
        .totals { margin-bottom: 16px; }
        .totals .line { display: flex; justify-content: space-between; margin-bottom: 8px; color: #e8b4b4; }
        .totals .grand { font-size: 1.2rem; font-weight: 700; color: #fff; border-top: 1px solid #333; padding-top: 10px; }
        .checkout-btn { width: 100%; background: #e8b4b4; color: #1a1a1a; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .checkout-btn:hover { background: #fff; }
        .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 3000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: #1f1f1f; border: 1px solid #333; border-radius: 14px; width: 460px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; }
        .modal h2 { color: #fff; margin-bottom: 18px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 0.85rem; color: #e8b4b4; margin-bottom: 5px; }
        .field input, .field textarea { width: 100%; background: #2a2a2a; color: #e8b4b4; border: 1px solid #444; border-radius: 6px; padding: 11px; font-size: 0.95rem; font-family: inherit; }
        .field input:focus, .field textarea:focus { outline: none; border-color: #e8b4b4; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .btn-primary { flex: 1; background: #e8b4b4; color: #1a1a1a; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: #fff; }
        .btn-secondary { flex: 1; background: #2a2a2a; color: #e8b4b4; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-secondary:hover { border-color: #e8b4b4; }
        .order-confirm { text-align: center; }
        .order-confirm .big { font-size: 3rem; margin-bottom: 12px; }
        .order-confirm p { color: #e8b4b4; margin-bottom: 8px; }
        .order-id { color: #fff; font-weight: 700; font-family: monospace; word-break: break-all; }
        .error-text { color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; min-height: 1em; }

        @media (max-width: 600px) {
            header { padding: 12px 16px; }
            .brand .title { font-size: 1.1rem; }
            .page-title { font-size: 1.7rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
            .card-img { height: 140px; }
            .sk-card .sk-img { height: 140px; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <img src="images/logo.png" alt="Logo">
        <span class="title">Jogratz Store</span>
    </div>
    <div class="header-right">
        <a href="index.html" class="back-link">← Portfolio</a>
        <button class="cart-btn" onclick="toggleCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
    </div>
</header>

<div class="container">
    <h1 class="page-title">Nike Shoes</h1>
    <p class="page-sub">Fresh kicks, straight to your door.</p>
    <div id="notice" class="notice" style="display:none;"></div>
    <div class="grid" id="productGrid">
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
    </div>
</div>

<!-- CART PANEL -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
    <div class="cart-head">
        <h2>Your Cart</h2>
        <button class="close-cart" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
        <div class="totals">
            <div class="line"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
            <div class="line grand"><span>Total</span><span id="total">$0.00</span></div>
        </div>
        <button class="checkout-btn" id="checkoutBtn" onclick="openCheckout()">Checkout</button>
    </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal-overlay" id="checkoutModal">
    <div class="modal">
        <h2>Checkout</h2>
        <div class="field"><label>Full Name</label><input type="text" id="cName" placeholder="Juan Dela Cruz"></div>
        <div class="field"><label>Email</label><input type="email" id="cEmail" placeholder="you@example.com"></div>
        <div class="field"><label>Phone</label><input type="tel" id="cPhone" placeholder="09xxxxxxxxx"></div>
        <div class="field"><label>Address</label><textarea id="cAddress" rows="2" placeholder="Street, City, Province"></textarea></div>
        <div class="error-text" id="checkoutError"></div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeCheckout()">Cancel</button>
            <button class="btn-primary" id="submitOrderBtn" onclick="submitOrder()">Place Order</button>
        </div>
    </div>
</div>

<!-- CONFIRMATION MODAL -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal">
        <div class="order-confirm">
            <div class="big">✅</div>
            <h2>Order Placed!</h2>
            <p>Thank you for your order.</p>
            <p>Your Order ID:</p>
            <p class="order-id" id="confirmOrderId"></p>
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="closeConfirm()">Continue Shopping</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="products-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
    const sb = (window.isSupabaseConfigured && window.isSupabaseConfigured())
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    const FALLBACK_PRODUCTS = [
        { id: '11111111-1111-1111-1111-111111111111', name: 'Nike Air Force 1 Low', price: 120, image_url: 'nike1.jpg', description: 'Classic low-top with premium leather.', sizes: [6,7,8,9,10,11,12] },
        { id: '22222222-2222-2222-2222-222222222222', name: 'Jordan 1 Retro Bred',  price: 170, image_url: 'nike2.jpg', description: 'Iconic black and red colorway.', sizes: [6,7,8,9,10,11,12] },
        { id: '33333333-3333-3333-3333-333333333333', name: 'Nike Dunk Orange',     price: 150, image_url: 'nike3.jpg', description: 'Vibrant orange Dunk low.', sizes: [6,7,8,9,10,11,12] },
        { id: '44444444-4444-4444-4444-444444444444', name: 'Jordan 1 Mocha',       price: 180, image_url: 'nike4.jpg', description: 'Mocha brown suede and leather.', sizes: [6,7,8,9,10,11,12] },
        { id: '55555555-5555-5555-5555-555555555555', name: 'Nike Dunk Navy',       price: 155, image_url: 'nike5.jpg', description: 'Navy blue Dunk low.', sizes: [6,7,8,9,10,11,12] }
    ];

    let products = [];
    let cart = JSON.parse(localStorage.getItem('nike_cart') || '[]');

    function imgUrl(p) {
        if (!p.image_url) return 'images/logo.png';
        if (/^https?:\/\//.test(p.image_url)) return p.image_url;
        return 'images/' + p.image_url.replace(/^\/?images\//, '');
    }

    function fmt(n) { return '$' + Number(n).toFixed(2); }

    async function fetchProducts() {
        const grid = document.getElementById('productGrid');
        const notice = document.getElementById('notice');

        // Skeleton cards already in HTML — hold min 400ms so shimmer reads, no flash
        const minDelay = new Promise(r => setTimeout(r, 400));

        if (sb) {
            try {
                const [res] = await Promise.all([
                    sb.from('products').select('*').order('price', { ascending: true }),
                    minDelay
                ]);
                const { data, error } = res;
                if (!error && data && data.length) {
                    products = data;
                    renderProducts();
                    return;
                }
            } catch (e) {
                console.error('Failed to load products from Supabase:', e);
            }
        }

        // Offline fallback: preloaded static data
        const preloaded = window.PRELOADED_PRODUCTS;
        if (preloaded && preloaded.length) {
            products = preloaded;
            renderProducts();
            notice.style.display = 'none';
            return;
        }

        // Nothing available — fallback samples
        products = FALLBACK_PRODUCTS;
        renderProducts();
        notice.style.display = 'block';
        notice.textContent = 'Showing sample products. Add your Supabase keys in config.js to load live data.';
    }

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = products.map(p => {
            const sizes = (p.sizes && p.sizes.length) ? p.sizes : [6,7,8,9,10,11,12];
            return `
                <div class="card">
                    <div class="card-img"><img src="${imgUrl(p)}" alt="${p.name}" onerror="this.src='images/logo.png'"></div>
                    <div class="card-body">
                        <h3>${p.name}</h3>
                        <div class="desc">${p.description || ''}</div>
                        <div class="price">${fmt(p.price)}</div>
                        <div class="row">
                            <select class="size-select" id="size-${p.id}">
                                ${sizes.map(s => `<option value="${s}">US ${s}</option>`).join('')}
                            </select>
                            <button class="add-btn" onclick="addToCart('${p.id}')">Add to Cart</button>
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    function addToCart(productId) {
        const product = products.find(p => String(p.id) === String(productId));
        if (!product) return;
        const size = document.getElementById('size-' + productId).value;
        const key = productId + '::' + size;
        const existing = cart.find(c => (c.productId + '::' + c.size) === key);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({
                productId, name: product.name, price: Number(product.price),
                size, quantity: 1, imageUrl: imgUrl(product)
            });
        }
        saveCart();
        renderCart();
        openCart();
    }

    function removeFromCart(productId, size) {
        cart = cart.filter(c => !(c.productId === productId && c.size === size));
        saveCart();
        renderCart();
    }

    function changeQty(productId, size, delta) {
        const item = cart.find(c => c.productId === productId && c.size === size);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) {
            cart = cart.filter(c => !(c.productId === productId && c.size === size));
        }
        saveCart();
        renderCart();
    }

    function saveCart() { localStorage.setItem('nike_cart', JSON.stringify(cart)); }

    function updateCartCount() {
        const count = cart.reduce((sum, c) => sum + c.quantity, 0);
        document.getElementById('cartCount').textContent = count;
    }

    function cartSubtotal() { return cart.reduce((sum, c) => sum + (c.price * c.quantity), 0); }

    function renderCart() {
        updateCartCount();
        const box = document.getElementById('cartItems');
        if (!cart.length) {
            box.innerHTML = '<div class="cart-empty">Your cart is empty.</div>';
        } else {
            box.innerHTML = cart.map(c => `
                <div class="cart-item">
                    <img src="${c.imageUrl}" alt="${c.name}" onerror="this.src='images/logo.png'">
                    <div class="info">
                        <div class="name">${c.name}</div>
                        <div class="meta">Size US ${c.size}</div>
                        <div class="price">${fmt(c.price * c.quantity)}</div>
                        <div class="qty">
                            <button onclick="changeQty('${c.productId}','${c.size}',-1)">−</button>
                            <span>${c.quantity}</span>
                            <button onclick="changeQty('${c.productId}','${c.size}',1)">+</button>
                            <button class="remove-btn" onclick="removeFromCart('${c.productId}','${c.size}')" title="Remove">✕</button>
                        </div>
                    </div>
                </div>`).join('');
        }
        document.getElementById('subtotal').textContent = fmt(cartSubtotal());
        document.getElementById('total').textContent = fmt(cartSubtotal());
        document.getElementById('checkoutBtn').disabled = cart.length === 0;
    }

    function toggleCart() { openCart(); }
    function openCart() { document.getElementById('cartPanel').classList.add('open'); document.getElementById('cartOverlay').classList.add('open'); }
    function closeCart() { document.getElementById('cartPanel').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('open'); }

    function openCheckout() {
        if (!cart.length) return;
        closeCart();
        document.getElementById('checkoutModal').classList.add('open');
    }
    function closeCheckout() { document.getElementById('checkoutModal').classList.remove('open'); }

    async function submitOrder() {
        const name = document.getElementById('cName').value.trim();
        const email = document.getElementById('cEmail').value.trim();
        const phone = document.getElementById('cPhone').value.trim();
        const address = document.getElementById('cAddress').value.trim();
        const errBox = document.getElementById('checkoutError');

        if (!name || !email || !phone || !address) {
            errBox.textContent = 'Please fill in all fields.';
            return;
        }
        if (!sb) {
            errBox.textContent = 'Supabase is not configured. Add your keys in config.js.';
            return;
        }

        errBox.textContent = '';
        const btn = document.getElementById('submitOrderBtn');
        btn.disabled = true;
        btn.textContent = 'Placing order...';

        const items = cart.map(c => ({
            product_id: c.productId,
            product_name: c.name,
            price: c.price,
            size: Number(c.size),
            quantity: c.quantity
    }));

        const { data, error } = await sb
            .from('orders')
            .insert([{
                customer_name: name,
                email, phone, address,
                items,
                total: cartSubtotal(),
                status: 'Pending'
            }])
            .select()
            .single();

        btn.disabled = false;
        btn.textContent = 'Place Order';

        if (error) {
            errBox.textContent = 'Error placing order: ' + error.message;
            return;
        }

        cart = [];
        saveCart();
        renderCart();
        closeCheckout();
        document.getElementById('cName').value = '';
        document.getElementById('cEmail').value = '';
        document.getElementById('cPhone').value = '';
        document.getElementById('cAddress').value = '';
        showOrderConfirmation(data.id);
    }

    function showOrderConfirmation(orderId) {
        document.getElementById('confirmOrderId').textContent = orderId;
        document.getElementById('confirmModal').classList.add('open');
    }
    function closeConfirm() { document.getElementById('confirmModal').classList.remove('open'); }

    fetchProducts();
    renderCart();
</script>
</body>
</html>
